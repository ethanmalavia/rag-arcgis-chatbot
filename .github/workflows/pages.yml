name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend-react/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build SPA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        env:
          # Project Pages URL path: https://<owner>.github.io/rag-arcgis-chatbot/
          VITE_BASE: /rag-arcgis-chatbot/
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: |
          export VITE_API_BASE="${VITE_API_BASE:-https://rag-arcgis-chatbot-ygecps65ja-uc.a.run.app}"
          echo "Building with VITE_BASE=$VITE_BASE VITE_API_BASE=$VITE_API_BASE"
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend-react/dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
