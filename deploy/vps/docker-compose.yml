# One container: FastAPI + React UI.
# From this directory: ./up.sh
# Plesk proxies the public site to 127.0.0.1:8080. Do not publish 8080 on the internet.

services:
  app:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    image: rag-arcgis-chatbot:vps
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      SERVE_FRONTEND: "true"
      PORT: "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
